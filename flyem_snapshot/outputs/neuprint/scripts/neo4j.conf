#*****************************************************************
# Neo4j 5.x configuration
#
# For more details and a complete list of settings, see:
# https://neo4j.com/docs/operations-manual/current/reference/configuration-settings/
#*****************************************************************

server.config.strict_validation.enabled=false
dbms.security.authentication.enabled=false
dbms.security.authorization.enabled=false

# Make timestamps in cypher output consistent with python/bash logging.
db.temporal.timezone=SYSTEM

# The neo4j-admin memrec tool recommends against a heap size larger than 31G
# since above 32G Java will disable pointer compression ("compressed oops").
# SEE ALSO: When we call 'neo4j-admin database import full', we use --max-off-heap-memory
server.memory.heap.initial_size=31G
server.memory.heap.max_size=31G

# Assuming we run on big cluster nodes (>=16 slots)
# SEE ALSO: When we call 'neo4j-admin database import full', we use --max-off-heap-memory
server.memory.pagecache.size=150G

db.tx_log.rotation.retention_policy=1 days
dbms.security.procedures.unrestricted=apoc.*
server.directories.plugins=plugins
server.directories.logs=logs
initial.dbms.default_database=data

db.transaction.timeout=3600s

db.tx_state.memory_allocation=ON_HEAP

# Bolt connector
server.bolt.enabled=true

# HTTP Connector
server.http.enabled=true

# HTTPS Connector
server.https.enabled=false

#********************************************************************
# JVM Parameters
#********************************************************************

server.jvm.additional=-XX:+UseG1GC
server.jvm.additional=-XX:-OmitStackTraceInFastThrow
server.jvm.additional=-XX:+AlwaysPreTouch
server.jvm.additional=-XX:+UnlockExperimentalVMOptions
server.jvm.additional=-XX:+TrustFinalNonStaticFields
server.jvm.additional=-XX:+DisableExplicitGC
server.jvm.additional=-XX:MaxInlineLevel=15
server.jvm.additional=-XX:-UseBiasedLocking
server.jvm.additional=-Djdk.nio.maxCachedBufferSize=262144
server.jvm.additional=-Dio.netty.tryReflectionSetAccessible=true
server.jvm.additional=-Djdk.tls.ephemeralDHKeySize=2048
server.jvm.additional=-Djdk.tls.rejectClientInitiatedRenegotiation=true
server.jvm.additional=-XX:FlightRecorderOptions=stackdepth=256
server.jvm.additional=-XX:+UnlockDiagnosticVMOptions
server.jvm.additional=-XX:+DebugNonSafepoints
server.jvm.additional=-Dlog4j2.disable.jmx=true
